<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254">
  <title>白想's Blog — B + Mountain Logo</title>
  <desc>Pure SVG vector logo recreated from the selected reference artwork.</desc>
  <defs>
    <radialGradient id="bg" cx="47%" cy="43%" r="78%">
      <stop offset="0%" stop-color="#07142D"/>
      <stop offset="55%" stop-color="#061126"/>
      <stop offset="100%" stop-color="#07142B"/>
    </radialGradient>
    <linearGradient id="mountain" x1="0%" y1="0%" x2="100%" y2="100%">
